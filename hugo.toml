baseURL = "https://www.cellos.blog/"
title = "Cello's Blog"
defaultContentLanguage = "en"
enableRobotsTXT = true

[params]
  description = "Personal blog of Marcel Neumann"
  author = "Marcel Neumann"
  # Buttondown username, as in the form URL under Settings → Embedding.
  buttondown = "cellos.blog"

# Posts live at /<slug>/. Posts imported from Substack also carry an alias
# at /p/<slug>/ that redirects to the new address (see front matter).
[permalinks.page]
  posts = "/:slug/"

# Tags: listed at /tags/, one filtered post list per tag at /tags/<tag>/.
[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup.goldmark.renderer]
  # Posts converted from Substack may contain raw HTML (embeds, captions).
  unsafe = true
