<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f0d">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.subtitle }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with site.Home.OutputFormats.Get "rss" -}}
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">
  {{ end -}}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('typing');
      setTimeout(function () { document.documentElement.classList.remove('typing'); }, 4000);
    }
  </script>
  <script src="{{ "js/typing.js" | relURL }}" defer></script>
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-lazDbg8lRl3OKLFhtYKs-.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ site.Home.RelPermalink }}"><span class="user">cello@cellos.blog</span><span class="cursor" aria-hidden="true"></span></a>
    <nav>
      {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">[rss]</a>{{ end }}
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    # © {{ now.Year }} {{ site.Params.author }} · built with hugo
  </footer>
</body>
</html>
