name: Temporary preview build
on:
  push:
    branches: [tmp-preview]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gohugoio/hugo --pattern 'hugo_[0-9]*_linux-amd64.deb' --dir "$RUNNER_TEMP"
          sudo dpkg -i "$RUNNER_TEMP"/hugo_*_linux-amd64.deb
      - uses: actions/checkout@v4
      - run: hugo --baseURL "/"
      - name: Push built HTML (no images) to tmp-preview-build
        run: |
          cd public
          find . -path ./img -prune -o -type f -print | head -5
          rm -rf img
          git init -q -b tmp-preview-build
          git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm preview
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp-preview-build
