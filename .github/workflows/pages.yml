name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gohugoio/hugo \
            --pattern 'hugo_[0-9]*_linux-amd64.deb' --dir "$RUNNER_TEMP"
          sudo dpkg -i "$RUNNER_TEMP"/hugo_*_linux-amd64.deb
          hugo version
      - uses: actions/checkout@v4
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://www.cellos.blog' }}/"
      - name: Check post URLs, old /p/ redirects and subscribe form
        run: |
          test -f public/benefits-of-smart-laundry/index.html
          grep -q 'embed-subscribe/' public/benefits-of-smart-laundry/index.html
          grep -q 'benefits-of-smart-laundry/' public/p/benefits-of-smart-laundry/index.html
          grep -q 'embed-subscribe/' public/index.html
      - name: Check tags
        run: |
          # --minify drops attribute quotes, so match href with or without them
          grep -Eq 'href="?/tags/smart-home/' public/index.html
          grep -q 'benefits-of-smart-laundry/' public/tags/smart-home/index.html
          grep -Eq 'href="?/tags/smart-home/' public/benefits-of-smart-laundry/index.html
      - name: Check sitemap and robots.txt
        run: |
          grep -q '/benefits-of-smart-laundry/</loc>' public/sitemap.xml
          grep -q '^User-agent: GPTBot' public/robots.txt
          grep -q '^Sitemap: https://.*/sitemap.xml' public/robots.txt
      - name: Upload preview of the built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: public
          retention-days: 7
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
