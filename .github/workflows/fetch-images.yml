name: Fetch imported images

on:
  push:
    branches-ignore: [main]
    paths: [scripts/images.tsv]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-images.sh
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img
          git diff --cached --quiet || git commit -m "Add images imported from Substack"
          git push
